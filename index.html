
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pet Adoption Management System</title>

    <!-- Bootstrap 5 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="login-body">

    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">

            <div class="col-lg-10">
                <div class="login-container row g-0">

                    <!-- Left Section -->
                    <div class="col-md-5 login-image">
                        <div class="image-content">
                            <div class="pet-icon">🐾</div>

                            <h1>Find Your<br>Forever Friend</h1>

                            <p>
                                Every pet deserves a loving home.
                                Give them a second chance at happiness.
                            </p>

                            <div class="pet-decoration">🐶 🐱</div>
                        </div>
                    </div>

                    <!-- Right Section -->
                    <div class="col-md-7 login-form-section">

                        <div class="text-center mb-4">
                            <h2 class="brand-title">Pawfect Home</h2>
                            <p class="text-muted">
                                Pet Adoption Management System
                            </p>
                        </div>

                        <!-- Login and Register Tabs -->
                        <div class="auth-tabs">
                            <button class="auth-tab active" id="loginTab">
                                Login
                            </button>

                            <button class="auth-tab" id="registerTab">
                                Register
                            </button>
                        </div>

                        <!-- Login Form -->
                        <form id="loginForm">

                            <h4 class="form-heading">Welcome Back!</h4>

                            <p class="text-muted small">
                                Please enter your account details.
                            </p>

                            <label for="loginUsername">Username</label>
                            <input
                                type="text"
                                id="loginUsername"
                                class="form-control"
                                placeholder="Enter your username"
                                required
                            >

                            <label for="loginPassword">Password</label>
                            <input
                                type="password"
                                id="loginPassword"
                                class="form-control"
                                placeholder="Enter your password"
                                required
                            >

                            <button type="submit" class="btn-pink">
                                Login
                            </button>

                            <p id="loginMessage" class="message"></p>
                            
                        </form>

                        <!-- Register Form -->
                        <form id="registerForm" class="hidden">

                            <h4 class="form-heading">Create Account</h4>

                            <p class="text-muted small">
                                Join us and find your new best friend!
                            </p>

                            <label for="registerName">Full Name</label>
                            <input
                                type="text"
                                id="registerName"
                                class="form-control"
                                placeholder="Enter your full name"
                                required
                            >

                            <label for="registerUsername">Username</label>
                            <input
                                type="text"
                                id="registerUsername"
                                class="form-control"
                                placeholder="Create a username"
                                required
                            >

                            <label for="registerEmail">Email</label>
                            <input
                                type="email"
                                id="registerEmail"
                                class="form-control"
                                placeholder="Enter your email"
                                required
                            >

                            <label for="registerPassword">Password</label>
                            <input
                                type="password"
                                id="registerPassword"
                                class="form-control"
                                placeholder="Create a password"
                                minlength="6"
                                required
                            >

                            <button type="submit" class="btn-pink">
                                Create Account
                            </button>

                            <p id="registerMessage" class="message"></p>

                        </form>

                        <p class="footer-text">
                            Made with ❤️ for every furry friend.
                        </p>

                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="script.js"></script>

</body>
</html>
